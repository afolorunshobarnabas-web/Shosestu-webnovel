name: Test Shosetsu Extension

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-extension:
    runs-on: ubuntu-latest

    steps:
    # 1. Pull the code from your repository
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Set up Java on the cloud server
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 3. Securely download the Shosetsu automated testing tool
    - name: Download Extension Tester Tool
      run: |
        curl -L -o extension-tester.jar https://shosetsu.app

    # 4. Execute the automated test and log results
    - name: Run Test Simulation
      run: |
        java -jar extension-tester.jar webnovel.lua
        
