name: Test Shosetsu Extension

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-extension:
    runs-on: ubuntu-latest

    steps:
    # 1. Pull your custom extension code from your repo
    - name: Checkout custom extension
      uses: actions/checkout@v4
      with:
        path: custom-source

    # 2. Clone the official Shosetsu extensions environment around it
    - name: Clone Shosetsu Extensions Environment
      run: |
        git clone https://gitlab.com shosetsu-env

    # 3. Setup Java 17 safely in the cloud container
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 4. Inject your Lua file into the official testing structure
    - name: Move and Run Dev Setup
      run: |
        cp custom-source/webnovel.lua shosetsu-env/
        cd shosetsu-env
        chmod +x ./dev-setup.sh
        ./dev-setup.sh

    # 5. Run the extension verification using the official test suite script
    - name: Execute Extension Test Verification
      run: |
        cd shosetsu-env
        java -jar bin/extension-tester.jar webnovel.lua
        
