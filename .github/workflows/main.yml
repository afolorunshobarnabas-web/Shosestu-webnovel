name: Test Shosetsu Extension

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-extension:
    runs-on: ubuntu-latest

    steps:
    # 1. Grab your webnovel.lua file
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Setup Node.js to evaluate the endpoint connections
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # 3. Simulate and verify the Webnovel endpoints with anti-block headers
    - name: Verify Webnovel API Endpoints
      run: |
        node -e "
        const https = require('https');
        
        function testEndpoint(url) {
          return new Promise((resolve, reject) => {
            const parsedUrl = new URL(url);
            
            const options = {
              hostname: parsedUrl.hostname,
              path: parsedUrl.pathname + parsedUrl.search,
              method: 'GET',
              headers: {
                'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
                'Accept': 'application/json, text/plain, */*',
                'Accept-Language': 'en-US,en;q=0.9',
                'Referer': 'https://webnovel.com',
                'Origin': 'https://webnovel.com',
                'Cache-Control': 'no-cache'
              }
            };

            https.get(options, (res) => {
              let data = '';
              res.on('data', chunk => data += chunk);
              res.on('end', () => {
                if (res.statusCode === 200) {
                  console.log('✓ Success fetching: ' + url.substring(0, 60) + '...');
                  try {
                    const parsed = JSON.parse(data);
                    console.log('  ✓ Valid JSON received.');
                    resolve();
                  } catch(e) {
                    console.log('  ✗ Failed parsing JSON response.');
                    reject(e);
                  }
                } else {
                  console.log('  ✗ HTTP Error Status: ' + res.statusCode);
                  reject(new Error('Status ' + res.statusCode));
                }
              });
            }).on('error', reject);
          });
        }

        async function run() {
          try {
            console.log('Testing Ranking List API with Browser Spoofing...');
            await testEndpoint('https://webnovel.com');
            
            console.log('\nTesting Search API...');
            await testEndpoint('https://webnovel.com');
            
            console.log('\nTesting Chapter Index API...');
            await testEndpoint('https://webnovel.com');
            
            console.log('\nEverything is live and reachable! Your extension parameters are correct.');
          } catch (err) {
            console.error('\nVerification Failed:', err.message);
            process.exit(1);
          }
        }
        run();
        "
        
