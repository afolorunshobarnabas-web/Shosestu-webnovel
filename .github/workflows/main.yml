name: Test Shosetsu Extension

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Download your repository code
    - name: Checkout repository code
      uses: actions/checkout@v4

    # Step 2: Install Lua on the runner
    - name: Install Lua runtime
      uses: leafo/gh-actions-lua@v10
      with:
        luaVersion: "5.4"

    # Step 3: Run your tester script
    - name: Run Extension Tester
      run: lua tester.lua
        chmod +x ./dev-setup.sh
        ./dev-setup.sh

    # 5. Run the extension verification using the official test suite script
    - name: Execute Extension Test Verification
      run: |
        cd shosetsu-env
        java -jar bin/extension-tester.jar webnovel.lua
        
